name: macOS app

# Builds Nodal.app for Apple Silicon and packages it as a drag-to-Applications disk image,
# uploaded as the Nodal-macOS-arm64 artifact. Signed with a Developer ID and notarized when the
# MACOS_* / APPLE_* secrets are configured, ad-hoc signed otherwise. For tagged releases,
# release.yml calls this workflow and attaches the DMG to the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Nodal.app (Apple Silicon)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build
        run: cargo build --release --locked -p nodal-app --bin nodal --target aarch64-apple-darwin

      - name: Smoke test (CLI)
        run: |
          BIN=target/aarch64-apple-darwin/release/nodal
          file "$BIN"
          "$BIN" --version
          python3 scripts/make-test-pano.py "$RUNNER_TEMP/test-pano.png" 1024
          "$BIN" tile -o "$RUNNER_TEMP/smoke-tour" "$RUNNER_TEMP/test-pano.png"
          "$BIN" info "$RUNNER_TEMP/smoke-tour"

      - name: Package Nodal.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Nodal-macOS-arm64
          path: dist/macos/*.dmg
          if-no-files-found: error

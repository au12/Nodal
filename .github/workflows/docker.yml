name: Unraid Docker image

# Builds the Nodal server image used by the Unraid template (unraid/nodal.xml), smoke-tests it,
# and publishes linux/amd64 + linux/arm64 to GHCR on pushes to main and version tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Validate Unraid template
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse("unraid/nodal.xml").getroot()
          image = os.environ["IMAGE"] + ":latest"
          repo = root.findtext("Repository")
          if repo != image:
              sys.exit(f"unraid/nodal.xml: Repository is {repo!r}, expected {image!r}")
          for tag in ("Name", "Overview", "WebUI", "Icon", "TemplateURL", "Support", "Project"):
              if not (root.findtext(tag) or "").strip():
                  sys.exit(f"unraid/nodal.xml: <{tag}> is empty")
          targets = {c.get("Target") for c in root.iter("Config")}
          for needed in ("8080", "/data", "NODAL_TOKEN"):
              if needed not in targets:
                  sys.exit(f"unraid/nodal.xml: missing Config for {needed}")
          print(f"template ok: {repo}")
          PY
          test -f assets/icon-512.png

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64) for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nodal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-test-docker.sh nodal:ci

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

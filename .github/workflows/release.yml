name: Release

# Push a v* tag (or create one from the Releases page) to publish a release. This builds Linux,
# Windows and the macOS app (via macos.yml), then publishes one release with notes from
# CHANGELOG.md, every binary and SHA256SUMS.txt. docker.yml publishes the matching image tags.
#
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # test builds only; publishing needs a tag

permissions:
  contents: read

jobs:
  build:
    name: nodal (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p nodal-app --bin nodal --target ${{ matrix.target }}
      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p pkg && cp target/${{ matrix.target }}/release/nodal README.md LICENSE pkg/
          tar -C pkg -czf nodal-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/nodal.exe, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath nodal-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nodal-${{ matrix.target }}
          path: nodal-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  macos:
    name: macOS app
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  publish:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" | tee notes.md
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$GITHUB_REF_NAME
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created by hand on the Releases page: keep its text unless it was left empty.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Nodal ${TAG#v}" --notes-file notes.md
          fi

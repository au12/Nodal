  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
  <g clip-path="url(#sphere)" fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="7">
    <ellipse cx="256" cy="256" rx="150" ry="52"/>
    <ellipse cx="256" cy="256" rx="64" ry="150"/>
    <ellipse cx="256" cy="256" rx="118" ry="150" stroke-opacity="0.3"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <line x1="106" y1="256" x2="406" y2="256" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="256" cy="256" r="26" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>

  </g>

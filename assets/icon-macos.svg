<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#drop)" transform="translate(100 100) scale(1.716667) translate(-16 -16)">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2027"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFB547" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="1" stop-color="#F59E2B"/>
    </linearGradient>
    <clipPath id="sphere"><circle cx="256" cy="256" r="150"/></clipPath>

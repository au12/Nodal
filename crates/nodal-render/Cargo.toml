[package]
name = "nodal-render"
description = "wgpu panorama renderer with virtual-texture tile streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nodal-core = { path = "../nodal-core" }
wgpu = { version = "30" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "Blob", "ImageBitmap", "ImageBitmapOptions", "ColorSpaceConversion", "PremultiplyAlpha", "RequestInit", "RequestMode", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData"] }

[features]
default = []

[dev-dependencies]
nodal-tiler = { path = "../nodal-tiler" }
tempfile = "3"

[package]
name = "nodal-stitch"
description = "Panorama stitching engine: feature matching, lens calibration, bundle adjustment, seam finding, multi-band blending and hole filling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
rayon = "1.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = { version = "0.6", features = ["simd"] }
flashraw = { version = "0.4", default-features = false, features = ["rayon", "simd", "mmap"] }
tiff = "0.11"
moxcms = { version = "0.8", features = ["extended_range"] }
flate2 = "1"
# Learned matcher (`ml` feature): ONNX Runtime, statically linked from pyke's prebuilt binaries.
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
sha2 = { version = "0.10", optional = true }
dirs = { version = "6", optional = true }

[features]
default = []
# RaCo-ALIKED + LightGlue rescue matching for photos SIFT cannot connect (downloads ~65 MB of
# models on first use). On for the desktop app, off for the server image.
ml = ["dep:ort", "dep:ureq", "dep:sha2", "dep:dirs"]

[dev-dependencies]
tempfile = "3"
